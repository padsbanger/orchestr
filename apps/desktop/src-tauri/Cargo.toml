[package]
name = "orchestr-desktop"
version = "0.2.0"
description = "Orchestr local desktop control plane"
authors = ["Orchestr contributors"]
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orchestr-db = { path = "../../../crates/orchestr-db" }
orchestr-git = { path = "../../../crates/orchestr-git" }
orchestr-worker = { path = "../../../crates/orchestr-worker" }
orchestr-provider = { path = "../../../crates/orchestr-provider" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid.workspace = true
