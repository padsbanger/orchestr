name: Build and release desktop

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test persistence crate
        run: cargo test -p orchestr-db

      - name: Verify release tag matches the app version
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          app_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "$app_version" = "$GITHUB_REF_NAME"

      - name: Build test installer
        if: ${{ github.ref_type != 'tag' }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          args: --bundles nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: orchestr-windows-[arch]-[bundle]

      - name: Build and publish release installer
        if: ${{ github.ref_type == 'tag' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Orchestr ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: Orchestr_[version]_[arch][setup].[ext]
