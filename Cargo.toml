[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/orchestr-db",
    "crates/orchestr-git",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/orchestr-app/orchestr"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
